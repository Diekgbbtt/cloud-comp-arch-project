apiVersion: batch/v1
kind: Job
metadata:
  name: parsec-streamcluster
  labels:
    name: parsec-streamcluster
spec:
  template:
    spec:
      containers:
      - image: anakli/cca:parsec_streamcluster
        name: parsec-streamcluster
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args: ["-c", "taskset -c 3-7 ./run -a run -S parsec -p streamcluster -i native -n 5"]
        resources:
          requests:
            cpu: "4"
            #memory: "1Gi"
          limits:
            cpu: "5"
            #memory: "30Gi"
      restartPolicy: Never
      nodeSelector:
        cca-project-nodetype: "node-a-8core"
