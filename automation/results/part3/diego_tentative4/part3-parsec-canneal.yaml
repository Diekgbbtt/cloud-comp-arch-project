apiVersion: batch/v1
kind: Job
metadata:
  name: parsec-canneal
  labels:
    name: parsec-canneal
spec:
  template:
    spec:
      containers:
      - image: anakli/cca:parsec_canneal
        name: parsec-canneal
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        ### tentative with either no taskset among concurrent jobs or taskset only to canneal over the maximum range of cores
        args: ["-c", "./run -a run -S parsec -p canneal -i native -n 6"]
        resources:
          requests:
            cpu: "4"
            # memory: "1Gi"
          limits:
            cpu: "6"
            # memory: "1Gi"
      restartPolicy: Never
      nodeSelector:
        cca-project-nodetype: "node-a-8core"
