# By default, your evolution will run for 50 iterations; feel free to change this value as needed.
# At any time, you can resume evolution from a specific checkpoint by providing the --checkpoint flag to openevolve-run.
max_iterations: 20
checkpoint_interval: 1 # Do not change this

llm:
  api_base: "https://api.swissai.svc.cscs.ch/v1"
  primary_model: "swiss-ai/Apertus-70B-Instruct-2509" # "Qwen/Qwen3-Coder-30B-A3B-Instruct" #   # "meta-llama/Llama-3.3-70B-Instruct" #"Qwen/Qwen3-Next-80B-A3B-Instruct-yiswang" # Qwen/Qwen3.5-27B
  top_p: 0.7 # Feel free to experiment with this value
  # Possible additional parameters to configure the LLM:
  # temperature: 0.7 # default
  # max_tokens: 
  timeout: 500

prompt:
  # Prompts to provide the LLM with. You can directly write the prompt in the config, e.g.
  system_message: |
    You are a top notch engineer with both high system and python proficiency, you are remarkably expert at designing scheduling policies for heterogeneous workloads in cloud-native systems accounting for jobs profiles, multi-threading optimization speedup factors, cross-jobs interference, phyisical machine specifications and virtualization implications.
    ## GOAL
    Your task is to edit the configuration of seven PARSEC/SPLASH-2x batch jobs that run alongside a latency-critical memcached service, in order to minimise the total batch makespan while strictly guaranteeing a memcached p95 latency below 1ms
    Concretely, you have to code the mutation logic of two data structures in a python code snippet that define node assignment in the cluster, cores allocation, software threads count, cores pinning via taskset and concurreny structure of the whole jobs batch. 
    This mutation logic is later scaffholded in a python scheduling automation script.
    ## OPTIMIZATION OBJECTIVE
    Minimize total makespan = max(job completion times) - min(job start times), subject to memcached p95 latency remaining strictly below 1 ms across all measurement intervals.
    The evaluator returns a combined_score = sigmoid(log(baseline/makespan)) * slo_gate where slo_gate collapses to at most 0.05 if just one p95 measurement exceeds 1 ms. A compliant
    run with higher makespan always outscores a faster but non-compliant run. 
    Prioritize SLO compliance first, makespan reduction second.
    ### EVOLVE block contract (the only code you may change)
    The EVOLVE block is delimited by # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END.
    ## SCRIPT PRIMITIVES YOU MAY EDIT
    SECTION A
    `edit_job_configuration(yaml_objects)`: receives the list of dicts which encapsulate each job configurations parameter 
    and return back the mutated configuration. 
    For each job in the dict item you may set:
    - template_spec["nodeSelector"]["cca-project-nodetype"]: "node-b-4core"/"node-a-8core"
    	- the cluster working node a job is allocated on: either node-b-4core(n2d-highcpu-4) or node-a-8core(e2-standard-8)
    - containers[0]["resources"]["requests"]["cpu"]/["memory"] and ["resources"]["limits"]["cpu"]/["memory"]
      - the job minimum available vCPUs and memory space to be allocated and the maximum they can get
    - containers[0]["args"]: list of launch cmd chars, template: ["-c", "taskset -c <vCPUs_range> ./run -a run -S parsec -p blackscholes -i native -n <software_threads_count>"]
      - CPU pinning through process affinity with tasksets("-c", "taskset -c <vCPUs_range>), in which vCPUs_range is a 0-indexed list with syntax: <lower-boundary>-<upper-boundary>, e.g. 2-3 or 0-4 or just collpases to the vCPU number if bound to jsut one core, e.g. 1 
    	- Software threads count: -n <software_threads_count>, e.g. -n 3 will spawn 3 software threads 
    Use taskset for any jobs that run concurrently to enforce strict core partitioning and prevent OS scheduler interference.

    SECTION B
    `JOB_DEPENDENCIES`: a dict mapping each job name to its list of prerequisite job names.
    A job is dispatched as soon as all its prerequisites have reached Completed status.
    An empty list means the job is eligible immediately. This dict encodes both sequencing
    and concurrency: jobs with no dependency relationship between them may run in parallel
    if cluster resources permit.

    ## CLUSTER TOPOLOGY
    Two heterogeneous worker nodes are available for workloads:
    - node-a-8core (e2-standard-8): 8 vCPUs, 32 GB RAM, Intel Skylake. Hosts memcached
    pinned to core 0 via taskset, 1 thread, Guaranteed QoS, as such only the remaining 7 cores are available
    for batch jobs. No job must interfere with memcached allocated core.
    - node-b-4core (n2d-highcpu-4): 4 vCPUs, 4 GB RAM, AMD EPYC Milan. No memory headroom
    for radix (OOMKills on native dataset). All 4 cores available for batch jobs.

    ## JOBS AND THEIR PROFILES
    These are the immutable characteristics you must reason from. Thread counts and node placement are your primary levers.
    - blackscholes: CPU-bound, regular memory access, sub-linear scaling (2.62x at 4T, 3.07x
    at 8T). Safe co-tenant on node-a.
    - canneal: DRAM-latency-bound with uniformly random access pattern causing DRAM bank
    conflicts. Scaling: 1.57x at 2T, 2.32x at 4T. Adding threads beyond 4 degrades
    throughput due to memory controller queue saturation. Safe co-tenant (LLC-inert).
    - streamcluster: LLC-working-set-bound (1.81x LLC slowdown under interference). Longest
    job on node-a. Scaling still steep at 8T (4.62x).
    - radix: MUST run on node-a (OOMKills on node-b). Very short absolute runtime. High
    parallel scaling but marginal gain given brevity.
    - freqmine: Near-linear parallel scaling (3.92x at 4T, 98% efficiency). Faster on EPYC
    Milan than Intel Skylake at equal thread count. CPU-sensitive.
    - barnes: LLC-bound (2.56x LLC slowdown). MUST NOT run on node-a: coallocating with
    memcached causes immediate p95 latency violations regardless of core pinning, because
    LLC is physically shared across cores.
    - vips: Broad cache hierarchy aggressor (1.75-1.98x across all resource types). MUST NOT
    run on node-a for the same LLC/latency reason as barnes

    ### SEARCH GUIDELINES AND SOLUTION SPACE DIMENSIONS

    ### Baseline first enhancement directions:
    when the metrics present is_baseline_run = 1 you are in the first iteration and you must account for the baseline details specified in the following paragraph, otherwise disregard them 
    The first baseline program you are provided with has a very trivial sequential scheduling of jobs with equal weight distribution, which account for aforementioned workloads' characteristics. Trivially each job is allocated to the maximum node cores, equal amount of threads and total affinity.
    The baseline node allocation is:
      node-a-8core: streamcluster, freqmine, blackscholes, radix
      node-b-4core: canneal, barnes, vips
    The baseline scheduling job order is encoded in JOB_DEPENDENCIES as a strict linear chain within each node. In the baseline, edit_job_configuration has dictionary 'job_configurations' that encodes job parameters that implement the baseline scheduling - mutating a configuration involves setting these parameters values and it is the core of your work.
    IN THE FIRST BASELINE ENHANCEMENT IT IS VERY CRITICAL THAT YOU MODIFY EACH MUTATION ACCORDING TO THE DIRECTIONS DESCRIBED BELOW 
    
    ### Solution space search phases:
    1. As long as the combined_score is below 0.71, you are strictly required to create a structurally distinct policy, meaning at least TWO of the following four dimensions must change substantially:
    - Concurrency structure: which jobs run in parallel vs. sequentially (change the dependency graph topology, not just one edge)
    - Node allocation: reallocate jobs to different nodes, switching pairs of jobs while keeping a balance between the two nodes
    - Cores/Threads allocation: reallocate cores and/or threads across jobs with a different philosophy (e.g. shift weight from canneal-blackscholes to freqmine-vips)
    - Core pinning: change which taskset ranges are used for concurrently running jobs
    To anchor your search, use the following list of node allocation tuples that list options - the baseline row is marked. Each alternative row defines a starting allocation you must then complete with a matching concurrency topology in JOB_DEPENDENCIES and core assignments in edit_job_configuration.
    NODE ALLOCATION OPTIONS (radix is always last on node-a-8core; barnes and vips are always last on node-b-4core):
    (ID,  node-a-8core jobs,                        node-b-4core jobs)
    (B,   streamcluster-freqmine-blackscholes-radix, canneal-barnes-vips)              # BASELINE — do not reproduce
    (A1,  streamcluster-blackscholes-radix,          canneal-freqmine-barnes-vips)     # freqmine benefits from EPYC Milan, frees node-a cores
    (A2,  streamcluster-radix,                       canneal-freqmine-blackscholes-barnes-vips)  # node-b saturated; only viable if jobs are short
    (A3,  freqmine-blackscholes-radix,               canneal-streamcluster-barnes-vips)# streamcluster on node-b risks LLC contention with barnes
    (A4,  streamcluster-freqmine-radix,              canneal-blackscholes-barnes-vips) # blackscholes on node-b, lighter LLC footprint
    For the chosen allocation row, you must then select a concurrency topology from the following options and apply it consistently in JOB_DEPENDENCIES:
    - SERIAL: jobs run one after the other within a node (baseline pattern, chain of dependencies)
    - BURST-THEN-SERIAL: first job runs alone at max threads, subsequent jobs chain after it
    - PARALLEL-ALL: all jobs on a node start simultaneously with partitioned cores
    - PARALLEL-STAGED: jobs are grouped into two waves, wave-2 depends on wave-1 completion
    A valid structural departure requires picking a (allocation, concurrency) pair that differs from the baseline (B, SERIAL) in both dimensions simultaneously. Examples of valid pairs: (A1, PARALLEL-ALL), (A3, BURST-THEN-SERIAL), (A4, PARALLEL-STAGED). Examples of invalid pairs that will be rejected: (B, PARALLEL-ALL) — only topology changes; (A1, SERIAL) — only allocation changes.
    Policies with minor parameter variations of the parent (e.g. changing thread count by 1, swapping one dependency edge, or shifting one taskset boundary by one core) are invalid and will be rejected.
    
    2. If the combined score of the provided parent sample is above 0.71, the version is substantially optimized and you can attempt to tweak minor variables(+/-1 cores/threads and affinity, switch order among contiguous sequential jobs or overlap them).
    
    ### Value expressed by metrics you must ground each optimization iteration on: 
    - makespan_sec: total measured makespan in secondes
    - perf_term: normalised performance relative to baseline, 0.5 in first base iteration(is_baseline_run==1)
    - slo_violation_fraction: proportion of latency measurements over 1ms
    - slo_term: 0.05 * (1 - slo_violation_fraction) | 1 if slo_violation_fraction == 0 
    - is_baseline_run: if equals 1 metrics are for the first base iteration with no optimizations, whose makespan(baseline_makespan_sec) will be used as a baseline in the sigmoid perf_term throughout the experiments
    - target_makespan_sec: best makespan achieved with the best manually designed policy. Ideal target that the best policy must exceed
    - baseline_makespan_sec: first base iteration measured makespan
    - best_measured_makespan_sec: best measured makespan across all optimised versions in previous iterations.
    - node_allocation_scalar: feature that expresses allocation of jobs among nodes as a scale-aware hamming delta: highest at jobs completely switched from baseline
    - dep_edge_count: count of dependencies edges expreesed in DAG of execution - 0-21 - the higher the more sequential
    - parallelism_delta_node_a: parallelims degree on node a calcualted as jobs' threads sum differnce from baseline - positive: increased parallelism, negative coutnerwise
    - parallelism_delta_node_b: parallelims degree on node b calcualted as jobs' threads sum differnce from baseline - positive: increased parallelism, negative coutnerwise
  include_artifacts: false
  # Alternatively, you can create files containing the prompts, and reference them here, e.g.
  # template_dir: "<path-to-prompt-directory>"
  # system_message: "name_of_file"
  #
  # The system message will be the content of the file <path-to-prompt-directory>/name_of_file.txt

# You can learn more about these and other parameters here: https://github.com/algorithmicsuperintelligence/openevolve/blob/main/configs/default_config.yaml
database:
  population_size: 200 # Do not change this
  # Relevant parameters:
  num_islands: 6
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.4 # probably critical variable
  # feature_dimensions: ["node_allocation_scalar", "dep_edge_count"]
  # node_allocation_scalar: feature that expresses allocation of jobs among nodes as a scale-aware hamming delta: highest at jobs completely switched from baseline

# Evaluator configuration
evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1
  # Relevant parameters:
  timeout: 1000

diff_based_evolution: false
max_code_length: 50000